name: CI

# 3-stage CI/CD pipeline:
#   1. develop  — integration branch, all PRs merge here first
#   2. main     — production branch, deployable at all times
#   3. tags v*  — release triggers handled by release.yml, which calls this
#                 workflow as its quality gate via workflow_call. Tag pushes
#                 are deliberately absent below: listing them here made ci.yml
#                 run twice per release (once on the tag, once through
#                 release.yml). release.yml → quality is now the single
#                 validation path for a tag.
#
# Branch protection (scripts/setup-branch-protection.sh) requires the four
# contexts emitted below — the three `quality (<os>)` matrix contexts plus
# `security`. Do NOT rename those jobs or change the matrix OS values, or
# protection breaks.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main, develop]
    # Deliberately NO paths-ignore on pull_request (unlike push above): the
    # quality/security contexts are REQUIRED by branch protection, so a
    # docs-only PR that skipped this workflow would never report them —
    # GitHub would leave the checks pending forever and unmergeable once
    # enforce_admins=true. Every PR must run the workflow.
  workflow_call:
    inputs:
      # Explicit ref (a release tag) handed over by release.yml so the quality
      # gate validates the exact commit being published on dispatch runs.
      # Empty (push/PR runs) keeps the default checkout of the triggering ref.
      ref:
        description: 'Git ref to check out for the quality gates (optional).'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3"

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    # Bounds the quality gate. release.yml cannot set this on its `quality`
    # caller job (GitHub forbids `timeout-minutes` on reusable-workflow
    # callers), so the equivalent bound lives on the called job itself.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Empty input falls back to the default checkout of the triggering
          # ref; release.yml hands over the release tag on dispatch runs.
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          # No restore-keys: a stale cache built from a different bun.lock
          # would otherwise bind to this job; --frozen-lockfile installs are
          # fast enough that an exact-key miss costs seconds.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks (lint + format + typecheck)
        run: just check

      - name: Run tests (unit + integration, non-Linux — Linux gates via coverage run)
        if: runner.os != 'Linux'
        run: just test
        timeout-minutes: 15

      - name: Run E2E tests (Linux only — bash scripts)
        if: runner.os == 'Linux'
        run: just test-e2e
        timeout-minutes: 10

      - name: Coverage check with threshold (Linux only)
        if: runner.os == 'Linux'
        run: just coverage-check
        timeout-minutes: 15

  # Dependency CVE gate. Required by branch protection alongside the three
  # `quality (<os>)` contexts (see scripts/setup-branch-protection.sh); it
  # fails the run on high/critical advisories only.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: gitleaks scans commit ranges
          # (`--log-opts=<base>^..<head>`), which a depth-1 clone cannot
          # resolve on multi-commit pushes/PRs; the action README requires
          # fetch-depth: 0 for the same reason. Harmless for `bun audit`.
          fetch-depth: 0

      # Secret gate, second to the local .githooks/pre-commit hook (which CI
      # never runs and which skips itself when gitleaks is absent). The job
      # has no event guard, so this reports on push, pull_request and
      # workflow_call alike — docs-only PRs included. Failing here fails the
      # `security` context that branch protection already requires, so the
      # gate blocks merges without touching setup-branch-protection.sh.
      # SHA-pinned per ADR-019: e0c47f4f... = tag v3.0.0, resolved via GitHub
      # API GET /repos/gitleaks/gitleaks-action/commits/v3.0.0 (GPG-verified
      # commit). v3 not v2: v2's Node 20 runtime was removed from
      # GitHub-hosted runners on 2026-09-16, so @v2 no longer executes.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          # Required by the action on pull_request runs — it hard-exits
          # without it while listing PR commits. Read-only under this job's
          # permissions; also drives the owner-type check (user account → no
          # GITLEAKS_LICENSE needed).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR review comments require pull-requests:write, which this job
          # deliberately withholds (least privilege, ADR-019); leaving them
          # on would 403 mid-scan. The gate signal is the job status + job
          # summary + SARIF artifact instead.
          GITLEAKS_ENABLE_COMMENTS: "false"
        # Config: .gitleaks.toml at the repo root, auto-discovered by the
        # gitleaks CLI (precedence #4) — same file the local hook reads.

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency CVE scan
        # Scanner choice (verified locally on Bun 1.4.2, present since 1.2.15):
        #  - `bun pm scan` is Bun's Security Scanner API and refuses to run
        #    without a third-party scanner configured in bunfig.toml
        #    ("no security scanner configured"); this repo has none.
        #  - `npm audit` requires package-lock.json, which this repo does not
        #    track (bun.lock is the source of truth); it exits ENOLOCK.
        #  - `bun audit` reads bun.lock, queries the npm advisory endpoint and
        #    exits non-zero above the threshold → the one scanner that works
        #    unconfigured here.
        run: bun audit --audit-level=high

  packaging:
    # PR-only. The Linux `just test`/coverage step and the macOS `just test`
    # run already exercise packaging, so this job is redundant on branch pushes
    # and on release runs (release.yml → quality). Kept for the PR gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          # No restore-keys: a stale cache built from a different bun.lock
          # would otherwise bind to this job; --frozen-lockfile installs are
          # fast enough that an exact-key miss costs seconds.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run packaging tests
        run: just test-packaging

  # Markdown lint gate (markdownlint-cli2, config: .markdownlint-cli2.jsonc).
  # Informational — NOT a branch-protection context — but it runs
  # unconditionally (no event guard) so release.yml → workflow_call gates
  # releases on it too: the release job `needs: quality`, and a reusable
  # workflow only reports success once every job inside it succeeds.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Empty input falls back to the default checkout of the triggering
          # ref; release.yml hands over the release tag on dispatch runs.
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint Markdown (markdownlint-cli2)
        run: just lint-docs
