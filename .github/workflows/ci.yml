name: CI

# 3-stage CI/CD pipeline:
#   1. develop  — integration branch, all PRs merge here first
#   2. main     — production branch, deployable at all times
#   3. tags v*  — release triggers handled by release.yml, which calls this
#                 workflow as its quality gate via workflow_call. Tag pushes
#                 are deliberately absent below: listing them here made ci.yml
#                 run twice per release (once on the tag, once through
#                 release.yml). release.yml → quality is now the single
#                 validation path for a tag.
#
# Branch protection (scripts/setup-branch-protection.sh) requires the three
# `quality (<os>)` matrix contexts emitted below — do NOT rename the job or
# change the matrix OS values, or protection breaks.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_call:
    inputs:
      # Explicit ref (a release tag) handed over by release.yml so the quality
      # gate validates the exact commit being published on dispatch runs.
      # Empty (push/PR runs) keeps the default checkout of the triggering ref.
      ref:
        description: 'Git ref to check out for the quality gates (optional).'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3"

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    # Bounds the quality gate. release.yml cannot set this on its `quality`
    # caller job (GitHub forbids `timeout-minutes` on reusable-workflow
    # callers), so the equivalent bound lives on the called job itself.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Empty input falls back to the default checkout of the triggering
          # ref; release.yml hands over the release tag on dispatch runs.
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks (lint + format + typecheck)
        run: just check

      - name: Run tests (unit + integration, non-Linux — Linux gates via coverage run)
        if: runner.os != 'Linux'
        run: just test
        timeout-minutes: 15

      - name: Run E2E tests (Linux only — bash scripts)
        if: runner.os == 'Linux'
        run: just test-e2e
        timeout-minutes: 10

      - name: Coverage check with threshold (Linux only)
        if: runner.os == 'Linux'
        run: just coverage-check
        timeout-minutes: 15

  # Dependency CVE gate. Not part of branch protection (only the three
  # `quality (<os>)` contexts are required); it fails the run on high/critical
  # advisories only.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency CVE scan
        # Scanner choice (verified locally on Bun 1.4.2, present since 1.2.15):
        #  - `bun pm scan` is Bun's Security Scanner API and refuses to run
        #    without a third-party scanner configured in bunfig.toml
        #    ("no security scanner configured"); this repo has none.
        #  - `npm audit` requires package-lock.json, which this repo does not
        #    track (bun.lock is the source of truth); it exits ENOLOCK.
        #  - `bun audit` reads bun.lock, queries the npm advisory endpoint and
        #    exits non-zero above the threshold → the one scanner that works
        #    unconfigured here.
        run: bun audit --audit-level=high

  packaging:
    # PR-only. The Linux `just test`/coverage step and the macOS `just test`
    # run already exercise packaging, so this job is redundant on branch pushes
    # and on release runs (release.yml → quality). Kept for the PR gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run packaging tests
        run: just test-packaging
